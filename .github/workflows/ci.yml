name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  ci:
    name: ci (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [stable, oldstable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Tidy check
        run: |
          make tidy
          git diff --exit-code || (echo "go.mod/go.sum are out of sync — run 'make tidy' and commit the result" && exit 1)

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: make lint
